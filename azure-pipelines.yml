trigger:
- main

stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - script: |
        mkdir build
        cp index.html build/index.html
      displayName: 'Build HTML application'

    - script: |
        test -f build/index.html
      displayName: 'Test build files'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'build'
        artifact: 'drop'
      displayName: 'Publish build artifact'

- stage: Test
  dependsOn: Build
  jobs:
  - deployment: TestDeployment
    environment: 'test-environment'
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - script: |
              echo "Deployed to Test Environment"
              ls -la $(Pipeline.Workspace)/drop

- stage: Production
  dependsOn: Test
  jobs:
  - deployment: ProductionDeployment
    environment: 'production-environment'
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - script: |
              echo "Deployed to Production Environment"
              ls -la $(Pipeline.Workspace)/drop
